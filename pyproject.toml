[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "film-compliance-agent"
version = "0.1.0"
description = "Film compliance policy loop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
vertex = [
  "google-genai>=1.0,<2",
]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "schemas*", "store*", "workers*"]
