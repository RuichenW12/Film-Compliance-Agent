[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "film-compliance-agent"
version = "0.1.0"
description = "Compliance workflow and policy loop for micro-drama filing"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
vertex = [
  "google-genai>=1.0,<2",
]
test = [
  # Starlette's TestClient imports `httpx`; the `httpx2` distribution ships a
  # module named `httpx2` and does not satisfy it.
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
cloud = [
  "google-cloud-firestore>=2.28,<3",
  "google-cloud-pubsub>=2.39,<3",
  "google-cloud-storage>=3.13,<4",
  "google-genai>=1,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "policy*", "prompts*", "schemas*", "store*", "workers*"]

[tool.setuptools.package-data]
policy = ["*.yaml"]
"prompts.policy" = ["*.md"]
