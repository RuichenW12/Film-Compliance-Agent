[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "film-compliance-agent"
version = "0.1.0"
description = "Film compliance policy loop"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["schemas*", "workers*"]
