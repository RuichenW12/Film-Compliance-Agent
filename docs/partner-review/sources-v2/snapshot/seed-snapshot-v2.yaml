  p6_legal_clauses:
    source_name: Official sources with mock-pending product mappings
    clauses:
      - clause_id: nrta-order-16-article-2
        title: 第二条
        text: 本办法所称微短剧，是指单集时长少于二十分钟，主题主线明确、故事情节连续完整、人物角色突出的剧集。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: nrta-order-16-article-5
        title: 第五条
        text: 特殊题材类别与较大投资额度的一类微短剧定义。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: nrta-order-16-article-14
        title: 第十四条
        text: 一类微短剧备案公示申请机构应具备相应资质，并提交《微短剧备案公示申请表》和剧情梗概等材料；特殊题材在主管部门认为确有必要时征求相关意见。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: nrta-order-16-article-17
        title: 第十七条
        text: 一类、二类微短剧播出前应申请内容审核和发行许可；三类微短剧由符合条件的播出单位进行播前审核并标注节目编号。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: nrta-order-16-article-19
        title: 第十九条
        text: 一类微短剧送审材料包括报审表、机构许可证、符合审核要求的样片、片头片尾和歌曲字幕表，以及适用时的境外人员批准文件。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: nrta-order-16-article-20
        title: 第二十条
        text: 主管部门应自受理一类微短剧申请之日起二十日内作出决定，其中组织专家评审的时间为十日。
        source_url: https://www.nrta.gov.cn/art/2026/7/31/art_113_73785.html
      - clause_id: tier-live-action-2026
        title: 真人微短剧联调门槛候选
        text: 联调值：T1 300万元，T2 100万元。
        source_url: https://whhlyj.baoji.gov.cn/zzzb/xygl/202601/t20260115_1240723.html
      - clause_id: tier-ai-generated-2026
        title: AI微短剧联调门槛候选
        text: 联调值：T1 80万元，T2 30万元。
        source_url: https://wxb.xzdw.gov.cn/wlcb/cbgz/202606/t20260626_680352.html
